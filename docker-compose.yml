services:
  postgres:
    image: postgres:16-alpine
    container_name: wiki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: wiki_secret
      POSTGRES_DB: wiki
    ports:
      - "5432:5432"
    volumes:
      - wiki_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki -d wiki"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wiki_pg_data:
